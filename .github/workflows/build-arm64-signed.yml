name: Croix Player Prime (ARM64 Signed Direct APK)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-prime-arm64:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Croix Player Prime
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Read App Version
        id: ver
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -n 1)
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -n 1)
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "Detected version: v${VERSION_NAME} (code ${VERSION_CODE})"

      - name: Prepare Digital Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_STORE_PASS: ${{ secrets.STORE_PASSWORD }}
          SECRET_ALIAS: ${{ secrets.ALIAS }}
          SECRET_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p app/keystore
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > app/keystore/release.keystore
            echo "STORE_PASSWORD=$SECRET_STORE_PASS" >> $GITHUB_ENV
            echo "ALIAS=$SECRET_ALIAS" >> $GITHUB_ENV
            echo "KEY_PASSWORD=$SECRET_KEY_PASS" >> $GITHUB_ENV
          else
            keytool -genkeypair -v \
              -keystore app/keystore/release.keystore \
              -alias croix_prime_release \
              -keyalg RSA -keysize 4096 -validity 10000 \
              -storepass CroixPrime2026! -keypass CroixPrime2026! \
              -dname "CN=Croix Player Prime, OU=Mobile, O=Croix, C=US"
            echo "STORE_PASSWORD=CroixPrime2026!" >> $GITHUB_ENV
            echo "ALIAS=croix_prime_release" >> $GITHUB_ENV
            echo "KEY_PASSWORD=CroixPrime2026!" >> $GITHUB_ENV
          fi

      - name: Run Engine & Design Unit Tests
        run: ./gradlew --console=plain --no-daemon :engine:ytmusic:test :core:design:testDebugUnitTest

      - name: Build Signed ARM64 Release APK
        run: ./gradlew --console=plain --no-daemon :app:assembleRelease

      - name: Verify APK Digital Signature & Stage Direct APK
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "Verifying signature for $APK_PATH"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name "apksigner" | sort -V | tail -n 1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --verbose "$APK_PATH"
          fi
          cp "$APK_PATH" CroixPlayerPrime-arm64-v8a-signed.apk

      - name: Upload Direct APK Artifact (Backup)
        uses: actions/upload-artifact@v4
        with:
          name: CroixPlayerPrime-arm64-v8a-signed
          path: CroixPlayerPrime-arm64-v8a-signed.apk
          retention-days: 30

      - name: Publish Direct Signed APK to GitHub Releases (Versioned + Latest)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.ver.outputs.version_name }}
          VERSION_CODE: ${{ steps.ver.outputs.version_code }}
        run: |
          VER_TAG="v${VERSION_NAME}"
          TITLE="Croix Player Prime ${VER_TAG} (ARM64 Signed APK)"
          NOTES="Croix Player Prime ${VER_TAG} (versionCode ${VERSION_CODE}) — APK firmado ARM64 (ARMv8/ARMv9) para Android 12+ compilado desde el commit ${GITHUB_SHA::7}. Firma RSA-4096 permanente para actualizaciones directas sin conflicto de paquetes."

          # 1. Update rolling latest-prime tag & release so permanent direct URL always points to newest APK
          git tag -f latest-prime "${GITHUB_SHA}"
          git push origin refs/tags/latest-prime --force
          if gh release view "latest-prime" >/dev/null 2>&1; then
            gh release upload "latest-prime" CroixPlayerPrime-arm64-v8a-signed.apk --clobber
            gh release edit "latest-prime" --title "${TITLE}" --notes "${NOTES}" --latest=false
          else
            gh release create "latest-prime" CroixPlayerPrime-arm64-v8a-signed.apk \
              --title "${TITLE}" --notes "${NOTES}" --latest=false
          fi

          # 2. Publish/Update explicit versioned release (e.g. v4.0.0-prime) and mark it as Latest!
          git tag -f "${VER_TAG}" "${GITHUB_SHA}"
          git push origin "refs/tags/${VER_TAG}" --force
          if gh release view "${VER_TAG}" >/dev/null 2>&1; then
            gh release upload "${VER_TAG}" CroixPlayerPrime-arm64-v8a-signed.apk --clobber
            gh release edit "${VER_TAG}" --title "${TITLE}" --notes "${NOTES}" --latest
          else
            gh release create "${VER_TAG}" CroixPlayerPrime-arm64-v8a-signed.apk \
              --title "${TITLE}" --notes "${NOTES}" --latest
          fi
